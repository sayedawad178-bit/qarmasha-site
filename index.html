<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قرمشة - أصل الطعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#8B0000] text-white font-sans text-center p-6">
    <h1 class="text-6xl font-black text-yellow-400 mt-10">قرمشة</h1>
    <p class="mt-4 text-2xl italic">القرمشة اللي على أصولها.. طعم يدخل الدماغ!</p>
    
    <div class="max-w-xl mx-auto mt-10 p-6 bg-white/10 rounded-2xl border border-white/20">
        <h2 class="text-3xl text-yellow-400 mb-6">قائمة الطعام</h2>
        <ul class="space-y-4 text-lg">
            <li class="p-3 border-b border-white/10">وجبة السنافر (قطعتين بروستد)</li>
            <li class="p-3 border-b border-white/10">وجبة التوفير (3 قطع بروستد)</li>
            <li class="p-3 border-b border-white/10">وجبة الوحش (4 قطع بروستد)</li>
            <li class="p-3 border-b border-white/10">عيلة قرمشة (8 قطع عائلية)</li>
        </ul>
    </div>
</body>
</html>
