<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو قرمشة الفاخر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-[#2a0000] text-white min-h-screen p-4">

    <h1 class="text-center text-5xl font-black text-yellow-500 my-8">قرمشة</h1>

    <div x-data="{ 
        selectedItem: {name: 'وجبة السنافر', price: '90 ج', desc: 'قطعتين بروستد مع البطاطس والخبز', img: 'IMG_4600.png'},
        menu: [
            {name: 'وجبة السنافر', price: '90 ج', desc: 'قطعتين بروستد مع البطاطس والخبز', img: 'IMG_4600.png'},
            {name: 'وجبة التوفير', price: '130 ج', desc: '3 قطع بروستد، الأكثر مبيعاً!', img: 'IMG_4601.png'},
            {name: 'وجبة الوحش', price: '165 ج', desc: '4 قطع بروستد مقرمشة', img: 'IMG_4603.png'},
            {name: 'عيلة قرمشة', price: '310 ج', desc: '8 قطع، لتر بيبسي، بطاطس عائلي', img: 'IMG_4604.png'},
            {name: 'زنجر كلاسيك', price: '65 ج', desc: 'ساندوتش زنجر كلاسيك', img: 'IMG_4605.png'},
            {name: 'زنجر سوبر سبايسي', price: '75 ج', desc: 'زنجر حراق يظبط الدماغ', img: 'IMG_4606.png'}
        ]
    }">

        <!-- قائمة المنيو (التي يختار منها) -->
        <div class="grid grid-cols-2 gap-3 mb-8">
            <template x-for="item in menu">
                <button @click="selectedItem = item" 
                        class="bg-[#1a0000] p-3 rounded-xl border border-yellow-700 hover:border-yellow-400 transition-all text-sm font-bold">
                    <span x-text="item.name"></span>
                </button>
            </template>
        </div>

        <!-- منطقة عرض الوجبة المختارة -->
        <div class="bg-[#1a0000] border-2 border-yellow-500 rounded-3xl p-6 shadow-2xl">
            <img :src="selectedItem.img" class="w-full h-64 object-cover rounded-xl mb-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-3xl font-bold" x-text="selectedItem.name"></h2>
                <span class="text-2xl font-black text-yellow-400" x-text="selectedItem.price"></span>
            </div>
            <p class="text-gray-300 mb-6" x-text="selectedItem.desc"></p>
            <a :href="'https://wa.me/201008622373?text=اريد طلب ' + selectedItem.name" 
               class="block w-full bg-green-600 text-center py-4 rounded-xl text-xl font-bold shadow-lg">
                طلب عبر واتساب 📲
            </a>
        </div>
    </div>

</body>
</html>
